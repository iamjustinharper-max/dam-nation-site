  --planks:repeating-linear-gradient(180deg,rgba(255,220,170,.06) 0 1px,transparent 1px 58px,rgba(0,0,0,.45) 58px 60px);
  --wood-face:linear-gradient(180deg,var(--wood-l),var(--wood) 55%,var(--wood-d));
  --oak-face:linear-gradient(180deg,var(--oak-l),var(--oak) 45%,var(--oak-d));
}
*{box-sizing:border-box}
html,body{height:100%}

button::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--grain-h);opacity:.5;pointer-events:none;mix-blend-mode:multiply}

button.primary{background:linear-gradient(180deg,#ffd071,var(--amber) 50%,var(--amber-d));color:#2a1707;border-color:#7a4a0c;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.25),0 0 14px rgba(240,169,46,.35),0 2px 3px rgba(0,0,0,.45)}
button.small{min-height:32px;padding:3px 9px}
button.on{background:linear-gradient(180deg,#ffd071,var(--amber) 50%,var(--amber-d));border-color:#7a4a0c;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 10px rgba(240,169,46,.4)}
h1{font:400 24px var(--display);margin:0;letter-spacing:.8px;color:var(--oak-l);text-shadow:0 -1px 0 rgba(0,0,0,.7),0 1px 0 rgba(255,225,170,.25),0 2px 6px rgba(0,0,0,.5)}

.ic{width:1.05em;height:1.05em;vertical-align:-0.18em;fill:currentColor;flex:none}
.ic.big{width:1.5em;height:1.5em}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:7px 12px;background:var(--wood-face);position:relative;border-bottom:3px solid #1a0e05;box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,170,.15);z-index:2}

header>*{position:relative}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;background:rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,220,170,.12);border-radius:20px;padding:3px 10px 3px 7px;font-size:14px}

@keyframes fillshift{from{background-position:100% 0}to{background-position:0 0}}

#panel{display:flex;flex-direction:column;min-height:0;background:var(--wood-face);position:relative;border-left:3px solid #1a0e05;box-shadow:inset 3px 0 12px rgba(0,0,0,.5)}

#panel>*{position:relative}
#tutorial{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#ffd68a,var(--oak-l));color:#2a1707;border-bottom:2px solid #1a0e05;font-weight:700;font-size:13px}
#tutorial[hidden]{display:none}

#damstat .secs{display:flex;gap:2px;margin:5px 0 4px;height:14px}

#damstat .secs i b{position:absolute;left:0;bottom:0;right:0;background:var(--moss)}

#damstat .net.bad{color:#ff8d84;font-weight:800} #damstat .net.warn{color:#ffc266;font-weight:700}

#tabs{display:flex;gap:6px;padding:8px 8px 0;background:rgba(0,0,0,.28);border-bottom:2px solid #1a0e05;box-shadow:inset 0 -3px 6px rgba(0,0,0,.4)}

.tab-body{overflow-y:auto;padding:10px 14px 16px;flex:1;scrollbar-color:var(--oak-d) transparent}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.5);box-shadow:0 1px 0 rgba(255,220,170,.07)}

.sec .fill{position:absolute;left:0;right:0;bottom:0;background:var(--bark);opacity:.95}

.overlay[hidden]{display:none}

}

  // Mock overlay for the web build. seconds>0 = countdown before the button enables.

let g, dirty=true, activeTab='beavers', unread=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));

function newGame(){

    day:0, river:0, speed:1, damsBuilt:0, complete:false,

const river=()=>riverAt(g.river);
const danger=()=>1+0.3*g.river;   // every threat scales with this
// ---- roster: beavers are individuals with experience per job
function tierOf(b,job){ const x=(b.xp&&b.xp[job||b.job])||0; return x>=TIER_XP[2]?2:x>=TIER_XP[1]?1:0; }
function newBeaver(job){ g.nextId=(g.nextId||0)+1; return {id:g.nextId, job:job||'idle', xp:{}}; }
function syncCounts(){ g.beavers=g.roster.length; for(const j of JOBS)g.jobs[j.id]=0; for(const b of g.roster)if(g.jobs[b.job]!=null)g.jobs[b.job]++; }
function jobPower(job){ let p=0; for(const b of g.roster)if(b.job===job){ const t=tierOf(b); p+=TIER_MULT[t]*(t===2&&has('council')?1.2:1); } return p; }
function addBeaver(job){ g.roster.push(newBeaver(job)); syncCounts(); }
function removeBeavers(n){ for(let k=0;k<n&&g.roster.length>1;k++){ let idx=0,best=1e9; g.roster.forEach((b,i)=>{ const x=Object.values(b.xp).reduce((a,c)=>a+c,0); if(x<best){best=x;idx=i} }); g.roster.splice(idx,1); } syncCounts(); }
function ensureRoster(){ if(!g.roster){ g.roster=[]; for(const j of JOBS)for(let k=0;k<(g.jobs[j.id]||0);k++)g.roster.push(newBeaver(j.id)); while(g.roster.length<g.beavers)g.roster.push(newBeaver('idle')); } syncCounts(); }
function applyJobCounts(counts){ // keep the most experienced in each role, fill gaps from idle
  for(const j of JOBS){ const want=counts[j.id]||0; const inJob=g.roster.filter(b=>b.job===j.id).sort((a,b)=>(b.xp[j.id]||0)-(a.xp[j.id]||0)); inJob.slice(want).forEach(b=>b.job='idle'); }
  for(const j of JOBS){ const want=counts[j.id]||0; let have=g.roster.filter(b=>b.job===j.id).length; const idleB=g.roster.filter(b=>b.job==='idle').sort((a,b)=>(b.xp[j.id]||0)-(a.xp[j.id]||0)); for(const b of idleB){ if(have>=want)break; b.job=j.id; have++; } }
  syncCounts(); }
function tierCounts(job){ const c=[0,0,0]; for(const b of g.roster)if(b.job===job)c[tierOf(b)]++; return c; }
const season=()=>{ const d=Math.max(0,g.day-1); if(rule().longWinter){ const x=d%150; return x<30?0:x<60?1:x<90?2:3; } return Math.floor(d/30)%4; };
const has=id=>!!g.research[id];

const storage=()=>BASE_STORAGE+(g.stores||0)*storeCap();

function buildStore(){ const c=storeCost(); if(!canAfford(c))return; pay(c); g.stores=(g.stores||0)+1; log('A new store is dug. Capacity: '+storage()+' of each material.','good'); dirty=true; }
const assigned=()=>Object.values(g.jobs).reduce((a,b)=>a+b,0);

function mults(){
  const s=season(), w=has('winter')?0.5:1;
  let food=1,wood=1,build=1,research=1,erosion=1;
  if(has('teeth'))wood*=1.5; if(has('trails'))food*=1.5; if(has('academy'))research*=1.5;
  if(s===0)food*=1.1;
  if(s===2){food*=1.2;wood*=1.2}
  if(s===3){food*=1-0.5*w;build*=1-0.3*w;erosion=0}
  if(active('drought'))food*=0.4;
  if(active('storm'))build*=0.5;
  if(active('tourists'))build*=0.5;
  let mud=1, stone=1;
  wood*=g.forest;                       // only standing mature trees yield wood; none standing = no wood
  if(g.hold>0&&!g.complete)food*=has('weirs')?1.6:1.3;   // the filling pond teems with fish
  if(has('flume'))build*=1.3;
  const ru=rule(); food*=ru.food||1; mud*=ru.mud||1; stone*=ru.stone||1; if(ru.noStone)stone=0;
  if(active('fisher'))build*=0.7; if(active('ice'))build*=0.6;
  if(boostDays>0){ food*=2; wood*=2; }  // rewarded boost
  const m=0.6+(g.morale/100)*0.6;
  return {food:food*m,wood:wood*m,mud:mud*m,stone:stone*m,build:build*m,research:research*m,erosion};
}
function damStrength(){
  return g.sections.reduce((a,s)=>{const t=SECTION_TYPES[s.type];return a+(s.progress>=1?t.strength*(s.type==='log'&&has('engineering')?1.3:1)*(s.hp/t.hp):0)},0);
}
function log(text,kind){ g.log.push({day:g.day,text,kind:kind||'info'}); if(g.log.length>80)g.log.shift(); if(activeTab!=='log')unread++; dirty=true; }
function canAfford(c){return Object.entries(c).every(([k,v])=>g.res[k]>=v)}
function pay(c){for(const [k,v] of Object.entries(c))g.res[k]-=v}
function costText(c){return Object.entries(c).map(([k,v])=>'<span class="'+(g.res[k]>=v?'':'no')+'">'+v+' '+k+'</span>').join(' · ')}
// =====================================================================
//  SIMULATION — one call per in-game day
// =====================================================================
function simDay(){
  g.day++;
  const m=mults(), R=river(), cap=storage();
  // production
  g.res.food=Math.min(cap,g.res.food+jobPower('forage')*3*m.food);
  g.res.wood=Math.min(cap,g.res.wood+jobPower('wood')*2*m.wood);
  g.res.mud=Math.min(cap,g.res.mud+jobPower('mud')*2*m.mud);
  g.res.stone=Math.min(cap,g.res.stone+jobPower('stone')*1*m.stone);
  g.res.science+=jobPower('research')*1*m.research;
  // experience
  { const gain=has('apprentice')?2:1; for(const b of g.roster){ if(b.job==='idle')continue; const before=tierOf(b); b.xp[b.job]=(b.xp[b.job]||0)+gain; const after=tierOf(b);
      if(after>before){ const jn=JOBS.find(j=>j.id===b.job); log('A beaver has become a '+TIER_NAME[after]+' '+(jn?jn.name.toLowerCase():b.job)+' ('+Math.round((TIER_MULT[after]-1)*100)+'% more effective).','good'); } } }
  // forest: lumberjacks fell mature trees; stumps regrow, faster when foragers plant seeds (never in winter)
  { const mature=()=>g.trees.filter(v=>v>=0.6).length; const before=mature();
    g.chop=(g.chop||0)+jobPower('wood')*FELL_PER_WORKER*(has('coppice')?0.5:1);
    while(g.chop>=1){ let bi=-1,best=-1; g.trees.forEach((v,i)=>{ if(v>=0.6&&v>best){best=v;bi=i} }); if(bi<0){g.chop=0;break} g.trees[bi]=0; g.chop-=1; }
    while(g.trees.length<forestN())g.trees.push(0.3);
    if(season()!==3){ const rate=(TREE_GROW+TREE_PLANT*Math.min(8,jobPower('forage')))*(has('coppice')?2:1)*(has('roots')?1.5:1); g.trees=g.trees.map(v=>Math.min(1,v+rate)); }
    const N=g.trees.length, now=mature(); g.forest=now/N;
    if(before>N/2&&now<=N/2)log('Half the forest is felled. Foragers plant seeds, but saplings take weeks to grow.','warn');
    if(before>N/4&&now<=N/4)log('Only a few trees still stand. Ration wood, or the lumberjacks will be waiting on saplings.','bad');
    if(before>0&&now===0)log('Not a tree left standing. Lumberjacks are idle until saplings mature.','dire'); }
  // kits: a fed, housed, happy colony grows on its own
  g.kitTimer++;
  if(boostDays>0)boostDays--;
  tickExpedition();
  if(g.kitTimer>=Math.min(rule().kitDays||12,has('nursery')?8:12)){ g.kitTimer=0; if(g.res.food>g.beavers*4&&g.beavers<housing()&&g.morale>=60){ { const job=neediestJob(); addBeaver(job); log('A kit has grown up and starts on '+JOBS.find(j=>j.id===job).name.toLowerCase()+'.','good'); } } }
  // food
  g.res.food-=g.beavers*0.5;
  if(g.res.food<0){
    g.res.food=0; g.starving++;
    if(g.starving===1)log('Food has run out. Hungry beavers work badly and will leave.','bad');
    if(g.starving%4===0&&g.beavers>1){removeBeavers(1);log('A starving beaver left the clan.','bad')}
    if(g.beavers<=1&&g.starving>=8&&!g.lost){ g.lost=true; log('The last beaver has given up. The colony has scattered.','dire'); }
  } else g.starving=0;
  // erosion first, then builders repair what the current took
  // erosion
  if(m.erosion>0){
    const f=flowNow();
    for(const s of g.sections.slice()) if(s.progress>=1) hurt(s,f*EROSION/SECTION_TYPES[s.type].resist,'the current',true);
  }
  // building
  let work=jobPower('build')*5*m.build;
  const todo=g.sections.find(s=>s.progress<1);
  if(todo&&work>0){
    const t=SECTION_TYPES[todo.type];
    const need=(1-todo.progress)*t.work;
    const used=Math.min(work,need);
    todo.progress+=used/t.work; work-=used;
    if(todo.progress>=0.999){todo.progress=1;todo.hp=t.hp;todo.wrecked=false;log('Section '+(g.sections.indexOf(todo)+1)+' ('+t.name+') finished.','good')}
  }
  g.repairStalled=null;
  if(work>0){
    const dmg=g.sections.filter(s=>s.progress>=1&&s.hp<SECTION_TYPES[s.type].hp).sort((a,b)=>a.hp/SECTION_TYPES[a.type].hp-b.hp/SECTION_TYPES[b.type].hp);
    for(const s of dmg){ if(work<=0)break; const t=SECTION_TYPES[s.type]; let add=Math.min(work,t.hp-s.hp);
      // repairs consume materials: half the wall's build cost per full rebuild
      for(const [k,v] of Object.entries(t.cost)){ const perHp=0.5*v/t.hp; const afford=g.res[k]/perHp; if(afford<add){ add=Math.max(0,afford); g.repairStalled=k; } }
      if(add<=0)continue;
      for(const [k,v] of Object.entries(t.cost)){ g.res[k]=Math.max(0,g.res[k]-add*0.5*v/t.hp); }
      s.hp+=add; work-=add; }
  }
  // events
  for(const e of g.events){
    e.days--;
    if(e.type==='storm'){ damageDam(flowNow()*1.5*(1+0.1*g.river)*(has('channels')?0.5:1)*(has('wardens')?0.7:1),'the storm'); if(g.hold>0&&!has('spillway')){ g.hold=Math.max(0,g.hold-(has('channels')?0.5:1)); } }
  }
  g.events=g.events.filter(e=>e.days>0);
  if(g.pending){ g.pending.days--; if(g.pending.days<=0){resolveRaid();g.pending=null} }
  if(g.pendingWeather){ g.pendingWeather.days--; if(g.pendingWeather.days<=0){ const w=g.pendingWeather; g.pendingWeather=null; startEvent(w.type,true); } }
  if(g.cooldown>0)g.cooldown--;
  else if(Math.random()<Math.min(0.2,0.04*danger())){ startEvent(pickEvent()); g.cooldown=Math.max(1,4-Math.floor(g.river/2)); if(g.river>=4&&Math.random()<0.2)startEvent(pickEvent()); }
  // morale
  let target=60+(g.res.food>g.beavers*5?15:0)+(idle()>0?10:0)-(g.starving?40:0)-(active('storm')||active('drought')?10:0);
  g.morale=clamp(g.morale+clamp(target-g.morale,-2,2),0,100);
  // dam complete?
  if(damReady()){
    g.hold+=clamp(damStrength()/R.req,0.3,1); // a leaky dam fills the pond slower
    if(g.hold<=1)log('The wall spans '+R.name+'. Hold it for '+holdNeed()+' days while the pond fills. Fish gather: foraging +30%.','good');
    if(g.hold>=holdNeed()){ g.complete=true; g.morale=clamp(g.morale+20,0,100); log(R.name+' is dammed! The pond is full behind your wall.','good'); }
  } else if(g.hold>0){ g.hold=0; log('The dam weakened and the pond is draining. Repair it to start filling again.','warn'); }
  if(g.day%3===0)save();
}
function hurt(s,amount,source,raw){
  if(!raw){ amount/=SECTION_TYPES[s.type].armor; if(has('masonry')&&(s.type==='stone'||s.type==='log'))amount/=1.5; }
  s.hp-=amount;
  if(s.hp<=0){ s.hp=0; s.progress=0; s.wrecked=true; log('Section '+(g.sections.indexOf(s)+1)+' was destroyed by '+source+'. It must be rebuilt.','bad'); g.morale=clamp(g.morale-5,0,100); }
}
function damageDam(amount,source){
  const built=()=>g.sections.filter(s=>s.progress>=1);
  let hits=0;
  while(amount>0&&built().length&&hits<4){
    const list=built(); const s=list[ri(0,list.length-1)];
    const chunk=Math.min(amount,Math.max(5,amount/2));
    hurt(s,chunk,source); amount-=chunk; hits++;
  }
}

// ---- events ----
const EVENTS={
  raid:    {w:(r,s)=>s===3?12:25},
  storm:   {w:(r,s)=>s===0?40:25},
  flood:   {w:(r,s)=>s===0?20:8},
  drought: {w:(r,s)=>s===1?28:10},
  trapper: {w:(r,s)=>has('camo')?5:10},
  crew:    {w:(r,s)=>(r===0||g.sections.length<2)?0:(has('camo')?1:2)+r*0.8},
  windfall:{w:()=>8},
  salmon:  {w:(r,s)=>s===2?14:7},
  wanderer:{w:()=>8},
  tourists:{w:(r,s)=>s===1?12:6},
  monster: {w:(r,s)=>r>=2?5:0},
};
function pickEvent(){
  const r=g.river,s=season(),ru=rule(); let tot=0; const list=[];
  const mult={storm:ru.stormW||1,raid:ru.raidW||1,trapper:ru.humanW||1,crew:ru.humanW||1,tourists:ru.humanW||1};
  for(const [k,v] of Object.entries(EVENTS)){const w=v.w(r,s)*(mult[k]||1); if(w>0){list.push([k,w]);tot+=w}}
  for(const [k,w] of Object.entries(ru.extra||{})){ if(k==='ice'&&s!==3)continue; list.push([k,w]); tot+=w; }
  let x=Math.random()*tot; for(const [k,w] of list){x-=w;if(x<=0)return k} return list[0][0];
}
function startEvent(type,now){
  const R=river(), r=g.river;
  if((type==='storm'||type==='flood')&&has('scouts')&&!now&&!g.pendingWeather){ g.pendingWeather={type,days:2}; log('Scouts read the sky: a '+(type==='storm'?'storm':'flash flood')+' will hit in two days. Put builders on repair.','warn'); return; }
  switch(type){
    case 'raid':
      if(has('scouts')&&!g.pending){ const d=has('alarm')?5:3; g.pending={type:'raid',days:d}; log('Scouts report a rival clan '+d+' days out. Post guards!','warn'); }
      else resolveRaid();
      break;
    case 'storm': g.events.push({type:'storm',days:Math.max(1,3+Math.floor(r/3)-(has('wardens')?1:0)),name:'Storm'}); log('A storm rolls in. Building slows and the water batters the dam.','warn'); break;
    case 'flood':{
      const dmg=flowNow()*6*(1+0.1*r)*(has('channels')?0.5:1)*(has('wardens')?0.7:1);
      const weakest=g.sections.filter(x=>x.progress>=1).reduce((a,x)=>Math.min(a,SECTION_TYPES[x.type].armor),4);
      const breach=Math.min(0.6,0.2+0.08*r)/weakest*(has('channels')?0.5:1)*(has('spillway')?0.4:1); // weak walls breach; log walls a quarter as often
      if(r>=2&&g.sections.length>=4&&Math.random()<breach){
        const lost=Math.floor(R.width/4)+1;
        lostSections=g.sections.splice(g.sections.length-lost,lost); if(g.sel>=g.sections.length)g.sel=-1;
        g.morale=clamp(g.morale-20,0,100); g.hold=0;
        log('FLASH FLOOD! The dam is breached and '+lost+' sections are swept away.','dire');
      } else { damageDam(dmg,'a flash flood'); if(g.hold>0)g.hold=Math.max(0,g.hold*(has('channels')?0.75:0.5)); log('A flash flood slams the dam'+(g.hold>0?' and the pond loses water':'')+'.','bad'); }
      g.events.push({type:'flood',days:1,name:'Flash flood'});
      break;}
    case 'drought': g.events.push({type:'drought',days:Math.max(2,6+r-(has('wardens')?1:0)),name:'Drought'}); log('Drought. Plants wither and foraging suffers for six days.','warn'); break;
    case 'trapper':
      if(has('camo')&&Math.random()<0.5){log('A park ranger walked right past your camouflaged colony.','good');break}
      {const lose=Math.min(g.beavers-1,Math.max(1+(r>=3?1:0),Math.floor(g.beavers*(0.08+0.02*r))));
       if(lose>0){removeBeavers(lose);g.morale=clamp(g.morale-15,0,100);log('A park ranger relocated '+lose+' beaver'+(lose>1?'s':'')+' downstream.','bad')}
       g.events.push({type:'human',days:2,name:'Park ranger',sprite:'ranger'});}
      break;
    case 'crew':{
      if(g.day<100||g.sections.length<3)break;
      if(has('camo')&&Math.random()<0.5){log('A logging crew scouted the river and missed your camouflaged dam.','good');break}
      const lost=Math.min(g.sections.length,Math.ceil(R.width/3));
      lostSections=g.sections.splice(g.sections.length-lost,lost); if(g.sel>=g.sections.length)g.sel=-1; g.morale=clamp(g.morale-20,0,100); g.hold=0;
      log('A logging crew tore out '+lost+' sections of the dam. The rest still stands.','dire');
      g.events.push({type:'human',days:2,name:'Logging crew',sprite:'logger'});
      break;}
    case 'tourists': g.events.push({type:'tourists',days:2+Math.floor(r/3),name:'Tourists on the bank'}); log('Tourists are wandering the bank taking photos. The beavers keep their heads down: building halves for two days.','warn'); break;
    case 'monster':{
      const def=jobPower('guard')*3.5*(has('sentries')?2:1); const dmg=Math.max(0,R.flow*(6+r)-def)*(has('channels')?0.7:1);
      g.events.push({type:'monster',days:2,name:'River monster!'});
      if(dmg<=0)log('A river monster surfaced below the dam, but your guards drove it off!','good');
      else { damageDam(dmg,'a river monster'); g.morale=clamp(g.morale-8,0,100); log('A river monster surfaced and tore at the dam!','bad'); }
      break;}
    case 'otters':{ const def=jobPower('guard')*3.5*(has('sentries')?2:1); const need=has('alarm')?3:6;
      if(def>=need){ log('Otters crept up to the food store, but the guards chased them off.','good'); }
      else { const f=Math.floor(g.res.food*rnd(0.15,0.3)); g.res.food-=f; log('Otter families raided the food store and made off with '+f+' food.','bad'); }
      g.events.push({type:'otters',days:2,name:'Otters'}); break; }
    case 'rockfall': damageDam(R.flow*4,'a rockfall'); log('Rocks tumbled from the bank onto the dam.','bad'); break;
    case 'lightning':{ const built=g.sections.filter(x=>x.progress>=1); if(built.length){ const sec=built[ri(0,built.length-1)]; hurt(sec,sec.hp+1,'a lightning strike',true); } flash=1; g.morale=clamp(g.morale-5,0,100); log('Lightning struck the dam!','bad'); break; }
    case 'gifts': g.res.food=Math.min(storage(),g.res.food+30+5*r); g.res.science+=15+3*r; log('Townsfolk left gifts by the bank: food and curious trinkets (+science).','good'); break;
    case 'fisher': g.events.push({type:'fisher',days:3,name:'Fishermen on the bank'}); log('Fishermen have set up on the bank. Builders keep their distance: building -30% for three days.','warn'); break;
    case 'ice': damageDam(R.flow*3*(has('wardens')?0.7:1),'an ice jam'); g.events.push({type:'ice',days:4,name:'Ice jam'}); log('An ice jam is grinding against the dam. Building slows for four days.','bad'); break;
    case 'bear':{ const def=jobPower('guard')*3.5*(has('sentries')?2:1); const need=has('alarm')?4:8;
      if(def>=need){ log('A bear came sniffing at the lodges. The guards saw it off.','good'); }
      else { const f=Math.floor(g.res.food*0.3); g.res.food-=f; g.morale=clamp(g.morale-10,0,100); log('A bear tore into the lodges and ate '+f+' food.','bad'); }
      g.events.push({type:'bear',days:2,name:'Bear!'}); break; }
    case 'windfall': g.res.wood=Math.min(storage(),g.res.wood+30+10*r); log('Windfall! A fallen tree yields '+(30+10*r)+' wood.','good'); break;
    case 'salmon': g.res.food=Math.min(storage(),g.res.food+40+10*r); log('Salmon run! +'+(40+10*r)+' food.','good'); break;
    case 'wanderer':
      if(g.beavers<housing()){ const job=neediestJob(); addBeaver(job); log('A wandering beaver joins the clan and starts on '+JOBS.find(j=>j.id===job).name.toLowerCase()+'.','good'); }
      else log('A wandering beaver wanted to join, but there was no room in the lodges.','warn');
      break;
  }
}
function resolveRaid(){
  const r=g.river;
  let strength=(4+r*4+rnd(0,2+r))*danger()*0.8*(rule().raidMult||1); if(has('scouts'))strength*=0.7;
  const defense=jobPower('guard')*3.5*(has('sentries')?2:1);
  g.events.push({type:'raid',days:2,name:'Rival raid'});
  if(defense>=strength){
    const loot=10+5*r; g.res.wood=Math.min(storage(),g.res.wood+loot); g.morale=clamp(g.morale+5,0,100);
    log('Your guards repelled a rival raid and seized '+loot+' wood from the fleeing thieves.','good');
  } else {
    const ratio=1-defense/strength;
    const share=Math.min(0.6,0.3+0.04*r); const w=Math.floor(g.res.wood*share*ratio), f=Math.floor(g.res.food*share*ratio);
    g.res.wood-=w; g.res.food-=f; g.morale=clamp(g.morale-10,0,100);
    log('Rival beavers raided the camp'+(defense>0?' despite your guards':'')+': stole '+w+' wood and '+f+' food.','bad');
    damageDam(ratio*strength*5*(1+0.1*r),'raiders');
  }
}

// ---- actions ----
function setJob(id,d){
  if(d>0){ const idleB=g.roster.filter(b=>b.job==='idle').sort((a,b)=>(b.xp[id]||0)-(a.xp[id]||0)); if(!idleB.length)return; idleB[0].job=id; }
  else { const inJob=g.roster.filter(b=>b.job===id).sort((a,b)=>(a.xp[id]||0)-(b.xp[id]||0)); if(!inJob.length)return; inJob[0].job='idle'; }
  syncCounts(); dirty=true; }
function addSection(){
  const t=SECTION_TYPES[g.nextType]; if(g.sections.length>=river().width||!canAfford(t.cost))return;
  pay(t.cost); g.sections.push({type:g.nextType,progress:0,hp:0,wrecked:false}); dirty=true;
}
function rebuildSection(i){
  const s=g.sections[i]; if(!s)return; const t=SECTION_TYPES[g.nextType]; if(!canAfford(t.cost))return;
  pay(t.cost); s.type=g.nextType; s.progress=0; s.hp=0; s.wrecked=false; g.complete=false; g.hold=0; dirty=true;
}
function buildLodge(){ const c=lodgeCost(); if(!canAfford(c))return; pay(c); g.lodges++; log('A new lodge is built. Housing: '+housing()+'.','good'); }
function sendExpedition(){
  if(!has('expedition')||g.away||g.roster.length<8||!canAfford({food:20}))return;
  pay({food:20}); const pick=g.roster.slice().sort((a,b)=>(a.job==='idle'?0:1)-(b.job==='idle'?0:1)||Object.values(a.xp).reduce((x,y)=>x+y,0)-Object.values(b.xp).reduce((x,y)=>x+y,0)).slice(0,5);
  g.away={days:12,beavers:pick}; g.roster=g.roster.filter(b=>!pick.includes(b)); syncCounts();
  log('Five beavers set off upriver on an expedition. Back in 12 days.','good'); dirty=true;
}
function tickExpedition(){
  if(!g.away)return; g.away.days--; if(g.away.days>0)return;
  const r=g.river, loot={wood:40+15*r,science:10+3*r}; if(has('stone'))loot.stone=15+5*r;
  for(const [k,v] of Object.entries(loot))g.res[k]=k==='science'?g.res[k]+v:Math.min(storage(),g.res[k]+v);
  let back=g.away.beavers; if(Math.random()<0.08*danger()){ back=back.slice(1); log('The expedition returned one beaver short: a ranger caught the youngest.','bad'); }
  for(const b of back){ b.job='idle'; g.roster.push(b); } syncCounts(); g.away=null;
  log('The expedition is back with '+Object.entries(loot).map(([k,v])=>v+' '+k).join(', ')+'.','good');
}
function foodBalance(){ return jobPower('forage')*3*mults().food-g.beavers*0.5; }
function neediestJob(){ // where a newcomer helps most: food first, then the thinnest unlocked job
  if(foodBalance()<0.6)return 'forage';
  const open=JOBS.filter(j=>!j.req||has(j.req)).filter(j=>j.id!=='guard'&&j.id!=='research');
  return open.reduce((a,j)=>g.jobs[j.id]<g.jobs[a.id]?j:a,open[0]).id;
}
function canRecruit(){ return g.beavers<housing()&&canAfford(recruitCost())&&foodBalance()>=0.5; }
function recruitBlock(){ if(g.beavers>=housing())return 'Lodges are full'; if(!canAfford(recruitCost()))return 'Not enough food'; if(foodBalance()<0.5)return 'Foragers can\'t feed another beaver'; return ''; }
function recruit(){ if(!canRecruit())return; pay(recruitCost()); const job=neediestJob(); addBeaver(job); log('A new beaver is recruited and starts on '+JOBS.find(j=>j.id===job).name.toLowerCase()+'.','good'); }
const researchCount=()=>Object.keys(g.research).length;
function sciCost(r){ return Math.round(r.cost*Math.pow(1.1,researchCount())); }
const TIER_NEED=[0,0,2,4]; const tierOpen=t=>g.damsBuilt>=TIER_NEED[t||1];
function canResearch(r){ return !has(r.id)&&tierOpen(r.tier)&&!(r.req&&!has(r.req))&&g.res.science>=sciCost(r)&&canAfford(r.mat||{}); }
function buy(id){ const r=RESEARCH.find(x=>x.id===id); if(!canResearch(r))return; g.res.science-=sciCost(r); pay(r.mat||{}); g.research[id]=true; log('Researched '+r.name+'.','good'); }
function nextRiver(){
  g.best=g.best||{}; const took=g.day-(g.riverStart||0); if(!g.best[g.river]||took<g.best[g.river])g.best[g.river]=took; g.riverStart=g.day;
  g.damsBuilt++; g.river++; g.sections=[]; g.sel=-1; g.complete=false; g.hold=0; g.forest=1; g.chop=0; g.pendingWeather=null; g.cooldown=8; g.events=[]; g.pending=null; lostSections=[];
  g.trees=Array(forestN()).fill(1);
  const R=river(), ru=rule();
  if(ru.startWrecked){ const type=has('stone')?'stone':has('mudpack')?'mud':'stick'; for(let i=0;i<Math.floor(R.width/2);i++)g.sections.push({type,progress:0,hp:0,wrecked:true}); }
  if(ru.noStone)applyJobCounts(Object.assign({},g.jobs,{stone:0}));
  if(g.damsBuilt===TIER_NEED[2])log('Tier II research is open: new discoveries await in the Research tab.','good');
  if(g.damsBuilt===TIER_NEED[3])log('Tier III research is open.','good');
  log('The clan moves upstream to '+R.name+': '+R.width+' sections wide, needs strength '+R.req+'.'+(ru.name?' '+ru.name+': '+ru.desc:''),'good'); save(); dirty=true;
}
function save(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(g))}catch(e){} }
function load(){ try{const s=localStorage.getItem(SAVE_KEY); if(s){g=JSON.parse(s); g.hold=g.hold||0; if(g.forest==null)g.forest=1; if(!g.trees){ const n=Math.round(g.forest*FOREST_N); g.trees=Array.from({length:FOREST_N},(_,i)=>i<n?1:0.3); g.chop=0; } g.kitTimer=g.kitTimer||0; g.pendingWeather=g.pendingWeather||null; g.repairStalled=null; g.stores=g.stores||0; if(g.tut==null)g.tut=g.day>0?99:0; ensureRoster(); return true}}catch(e){} return false; }

function plateFilter(){ const s=season(); if(active('storm')||active('flood'))return 'brightness(0.55) saturate(0.55) contrast(1.15)'; if(active('drought'))return 'sepia(0.55) saturate(1.25) brightness(1.05)'; return ['brightness(1.05) saturate(1.1)','saturate(1.15) contrast(1.05)','sepia(0.45) saturate(1.4) hue-rotate(-18deg) brightness(1.02)','saturate(0.2) brightness(1.18) contrast(0.92)'][s]; }
function plateFit(im){ const sc=Math.max(W/im.naturalWidth,H/im.naturalHeight); const dw=im.naturalWidth*sc, dh=im.naturalHeight*sc; return {dx:(W-dw)/2, dy:(H-dh)/2, dw, dh}; }
function geom(){
  const pk=plateKey();
  if(pk){
    const P=PLATES[pk], im=plateImgs[pk], f=plateFit(im);
    const hz=f.dy+P.hz*f.dh, damY=f.dy+P.dam*f.dh;
    const chan=y=>{ const v=(y-f.dy)/f.dh; const e=P.edges; let a=e[0], b=e[e.length-1];
      for(let i=0;i<e.length-1;i++){ if(v>=e[i][0]&&v<=e[i+1][0]){a=e[i];b=e[i+1];break} }
      if(v<e[0][0]){a=e[0];b=e[1]} if(v>e[e.length-1][0]){a=e[e.length-2];b=e[e.length-1]}
      const t=clamp((v-a[0])/Math.max(1e-6,b[0]-a[0]),0,1);
      return [f.dx+(a[1]+(b[1]-a[1])*t)*f.dw, f.dx+(a[2]+(b[2]-a[2])*t)*f.dw]; };
    return {hz,damY,chan,plate:pk,fit:f};
  }
  const hz=H*0.36, damY=H*0.64;
  const chan=y=>{const t=Math.max(0,(y-hz)/(H-hz)); const half=W*(0.07+0.31*t); return [W/2-half,W/2+half];};
  return {hz,damY,chan,plate:null};
}
function mix(a,b,t){ // hex colour mix
  const pa=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16)), pb=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function palette(){ // water and light colours per season/weather (the plate carries the landscape)
  const s=season(), storm=active('storm')||active('flood'), drought=active('drought');
  let p={skyTop:'#2a6aa8',skyBot:'#a9d5ea',ground:'#4e7d3a',ground2:'#2f5a2a',water:'#2f7fa8',water2:'#1a5678',pond:'#3d8fb8',fogA:0.10};
  if(s===2)Object.assign(p,{skyTop:'#3f6f9c',skyBot:'#e6c79a'});
  if(s===3)Object.assign(p,{skyTop:'#5b7ea3',skyBot:'#d9e6ef',ground:'#e3ebef',ground2:'#b9c8d2',water:'#5f93b0',water2:'#3a6a86',pond:'#6fa0bb',fogA:0.22});
  if(drought)Object.assign(p,{skyTop:'#c07f36',skyBot:'#f2d79a',ground:'#b09a4c',ground2:'#7a6a2e'});
  if(storm)Object.assign(p,{skyTop:'#1f2a36',skyBot:'#5a6672',water:'#3b5a6c',water2:'#1c2e3a',pond:'#456879',fogA:0.3});
  return p;
}
function bankX(u,y,G){ // map u in 0..1 to a bank x: left bank for u<0.5, right bank otherwise
  const [l,r]=G.chan(y); const m=18;
  return u<0.5 ? (l-m)*(u*2) : (r+m)+(W-r-m)*((u-0.5)*2);
}
function buildBackground(P,G){
  const {hz}=G;
  const c=document.createElement('canvas'); c.width=W*DPR; c.height=H*DPR;
  const o=c.getContext('2d'); o.setTransform(DPR,0,0,DPR,0,0);
  if(G.plate){ const im=plateImgs[G.plate], f=G.fit; o.filter=plateFilter(); o.drawImage(im,f.dx,f.dy,f.dw,f.dh); o.filter='none';
    if(season()===3){ const fr=o.createLinearGradient(0,0,0,G.damY); fr.addColorStop(0,'rgba(200,220,240,.35)'); fr.addColorStop(0.6,'rgba(230,240,250,.45)'); fr.addColorStop(1,'rgba(230,240,250,.1)'); o.fillStyle=fr; o.fillRect(0,0,W,G.damY); }
    if(active('storm')||active('flood')){ const st=o.createLinearGradient(0,0,0,hz); st.addColorStop(0,'rgba(20,26,36,.55)'); st.addColorStop(1,'rgba(20,26,36,0)'); o.fillStyle=st; o.fillRect(0,0,W,hz); }
  } else { // plate not loaded: plain sky and ground so the scene is never blank
    let gr=o.createLinearGradient(0,0,0,hz); gr.addColorStop(0,P.skyTop); gr.addColorStop(1,P.skyBot); o.fillStyle=gr; o.fillRect(0,0,W,hz+2);
    gr=o.createLinearGradient(0,hz,0,H); gr.addColorStop(0,P.ground); gr.addColorStop(1,P.ground2); o.fillStyle=gr; o.fillRect(0,hz,W,H-hz);
  }
  const hg=o.createLinearGradient(0,hz,0,hz+H*0.18); hg.addColorStop(0,'rgba(220,232,245,'+(0.18+P.fogA*0.5)+')'); hg.addColorStop(1,'rgba(220,232,245,0)'); o.fillStyle=hg; o.fillRect(0,hz-2,W,H*0.18);
  return c;
}
function drawLodge(x,y,s){
  const im=spriteImgs.lodge, h=68*s, w=im?h*im.naturalWidth/im.naturalHeight:h*1.6;
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x,y+2,w*0.5,h*0.12,0,0,Math.PI*2); ctx.fill();
  if(im)ctx.drawImage(im,x-w/2,y-h,w,h); else { ctx.fillStyle='#6b4726'; ctx.beginPath(); ctx.ellipse(x,y,w/2,h*0.6,0,Math.PI,0); ctx.fill(); }
}

const JOB_SPRITE={build:'builder',guard:'guard',research:'scientist',forage:'forager',wood:'lumberjack',stone:'miner',mud:'muddigger',idle:'idle'};
const jobSprite=(job,tier)=>{ const base=JOB_SPRITE[job]||'idle'; if(tier>0&&spriteImgs[base+(tier+1)])return base+(tier+1); if(job==='guard'&&has('sentries')&&spriteImgs.defender)return 'defender'; return base; };
const rivalSprite=()=>g.river>=5?'rival3':g.river>=2?'rival2':'rival';
const WORKING_JOBS=new Set(['build','wood','mud','stone','forage','research']);
// draws a sprite anchored at its feet (x,y) with height h; a = {face, moving, working, bob}
// Work loops per job. 'swing': wind up slowly, strike fast. 'dig': rock and crouch. 'pick': bend to the ground. 'study': slow sway.
const WORK_ANIM={build:'swing',wood:'swing',stone:'swing',mud:'dig',forage:'pick',research:'study',guard:'watch'};
// a = {face, mode:'walk'|'work'|'idle', job, bob, alpha}
function drawSprite(name,x,y,h,t,a){
  const im=spriteImgs[name]; if(!im)return false;
  const w=h*im.naturalWidth/im.naturalHeight, ph=t*7+a.bob;
  let hop=0,sq=0,rot=0,dip=0;
  if(a.mode==='walk'){ hop=Math.abs(Math.sin(ph*1.2))*h*0.08; sq=Math.sin(ph*2.4)*0.04; rot=a.face*0.05; }
  else if(a.mode==='work'){
    const k=WORK_ANIM[a.job]||'sway', c=Math.sin(t*3.2+a.bob);
    if(k==='swing'){ rot=a.face*(c>0?-0.2*c:0.1*c); sq=c<-0.7?0.06:0; }
    else if(k==='dig'){ rot=a.face*0.1*c; dip=Math.max(0,c)*h*0.05; sq=Math.max(0,c)*0.08; }
    else if(k==='pick'){ const d=Math.max(0,Math.sin(t*1.8+a.bob)); dip=d*h*0.09; sq=d*0.1; rot=a.face*d*0.12; }
    else if(k==='study'){ rot=0.04*Math.sin(t*1.1+a.bob); }
    else if(k==='watch'){ sq=0.015*Math.sin(t*1.4+a.bob); }
    else { sq=0.02*c; }
  } else { sq=0.012*Math.sin(t*1.5+a.bob); }
  const alpha=a.alpha==null?1:a.alpha; if(alpha<=0)return true;
  ctx.save(); ctx.globalAlpha=alpha;
  if(name!=='stormcloud'){ ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x,y+1,w*0.4*(1-hop/h*0.6),h*0.08,0,0,Math.PI*2); ctx.fill(); }
  ctx.translate(x,y-hop+dip); ctx.rotate(rot); ctx.scale(a.face*(1+sq),1-sq); ctx.drawImage(im,-w/2,-h,w,h); ctx.restore();
  return true;
}
function lodgePos(i,G){ const {hz,damY}=G; const lr=prng(i*17+3); const side=i%3===2?0.5:0; const y=G.plate?hz+6+lr()*(damY-hz)*0.4:H*(0.62+0.32*lr()); const u=side+0.16+lr()*0.22; const d=(y-hz)/(H-hz); return [bankX(u,y,G),y,G.plate?0.35+0.4*d:0.45+0.5*d]; }
const treeSlots=Array.from({length:40},(_,i)=>{ const r=prng(i*53+11); return {side:i%2?0.5:0,u:0.03+r()*0.12+(i%3===0?0.36:0),v:0.06+r()*0.55,s:0.85+r()*0.3,kind:r()<0.55?'pine':'leaf',seed:r()*10}; });
function treePos(i,G){ const sl=treeSlots[i]; const y=G.hz+(G.damY-G.hz)*sl.v; return [bankX(sl.side+sl.u,y,G),y]; }
const treeAnim={}; let prevTrees=null;
function treeColours(){ const s=season(); return s===2?['#8a4a1c','#c8722a','#f0a848']:s===3?['#5a4535','#7a6555','#e8f0f2']:['#245a34','#3f8a3f','#8fcf5a']; }
// stylised tree: stump < sapling < mature; kind = pine (layered) or leaf (blob canopy)
function drawTree(x,y,sc,growth,kind,seed,t,fall){
  const [dark,mid,hi]=treeColours(), winter=season()===3;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(-4*sc,2,16*sc,5*sc,0,0,Math.PI*2); ctx.fill();
  if(fall!=null)ctx.rotate(fall);
  if(growth<0.15){ ctx.fillStyle='#5a3a22'; ctx.beginPath(); ctx.roundRect(-6*sc,-9*sc,12*sc,10*sc,2*sc); ctx.fill(); ctx.fillStyle='#c9a06a'; ctx.beginPath(); ctx.ellipse(0,-9*sc,6*sc,2.5*sc,0,0,Math.PI*2); ctx.fill(); ctx.restore(); return; }
  const g=0.25+0.75*growth, h=140*sc*g, sway=Math.sin(t*0.8+seed)*0.02*g;
  ctx.rotate(sway);
  ctx.fillStyle='#4a3020'; ctx.fillRect(-4*sc*g,-h*0.35,8*sc*g,h*0.35);
  if(kind==='pine'){
    for(let k=0;k<3;k++){ const ty=-h*0.3-k*h*0.22, w=(40-k*9)*sc*g, hh=h*0.4;
      ctx.fillStyle=dark; ctx.beginPath(); ctx.moveTo(0,ty-hh); ctx.lineTo(w,ty); ctx.lineTo(-w,ty); ctx.closePath(); ctx.fill();
      ctx.fillStyle=mid; ctx.beginPath(); ctx.moveTo(0,ty-hh); ctx.lineTo(w,ty); ctx.lineTo(w*0.15,ty); ctx.closePath(); ctx.fill();
      if(winter){ ctx.fillStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.moveTo(0,ty-hh); ctx.lineTo(w*0.55,ty-hh*0.4); ctx.lineTo(-w*0.55,ty-hh*0.4); ctx.closePath(); ctx.fill(); } }
  } else if(winter){ ctx.strokeStyle='#5a4535'; ctx.lineWidth=1.6*sc; for(let k=0;k<5;k++){ ctx.beginPath(); ctx.moveTo(0,-h*0.35); ctx.lineTo((k-2)*9*sc*g,-h*0.75-Math.abs(k-2)*-5*sc); ctx.stroke(); }
  } else { const blobs=[[0,-0.72,0.34],[-0.26,-0.55,0.26],[0.26,-0.56,0.26],[-0.1,-0.86,0.22],[0.14,-0.9,0.2]];
    for(const [bx,by,br] of blobs){ ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(bx*h,by*h,br*h,0,Math.PI*2); ctx.fill(); }
    for(const [bx,by,br] of blobs){ ctx.fillStyle=mid; ctx.beginPath(); ctx.arc(bx*h-0.03*h,by*h-0.03*h,br*h*0.82,0,Math.PI*2); ctx.fill(); }
    for(const [bx,by,br] of blobs){ ctx.fillStyle=hi; ctx.beginPath(); ctx.arc(bx*h+0.05*h,by*h-0.08*h,br*h*0.42,0,Math.PI*2); ctx.fill(); } }
  ctx.restore();
}

const GATHER_JOBS=new Set(['forage','wood','mud','stone']);
function dropPointFor(job,i,G){ // where gatherers carry their haul: gatherers to a lodge, builders to the bank beside the dam
  if(job==='build'){ const [l,r]=G.chan(G.damY); return i%2?[l-26,G.damY+6]:[r+26,G.damY+6]; }
  const [hx,hy]=homeFor(i,G); return [hx+((i*31)%40)-20, hy+8];
}
function targetFor(job,i,G,variant){
  const {hz,damY,chan}=G, R=river(); i=i+(variant||0)*13;
  const seed=(i*7919)%97/97, seed2=(i*104729)%89/89;
  switch(job){
    case 'forage':{const y=G.plate?hz+12+seed*(damY-hz)*0.55:hz+50+seed*(H-hz-90); const [l]=chan(y); return [Math.max(20,l*0.12+seed2*l*0.55), y];}
    case 'wood':{ const m=[]; g.trees.forEach((v,k)=>{ if(v>=0.6)m.push(k) }); if(m.length){ const k=m[(i+(variant||0))%m.length]; const [tx,ty]=treePos(k,G); return [tx+(treeSlots[k].side?-16:16),ty+3]; }
      const y=G.plate?hz+12+seed*(damY-hz)*0.55:hz+50+seed*(H-hz-90); const [,r]=chan(y); return [r+(W-r)*(0.3+seed2*0.55), y]; }
    case 'mud':{const y=damY+30+seed*(H-damY-50); const [l]=chan(y); return [l-14-seed2*36, y];}
    case 'stone':{const y=damY+30+seed*(H-damY-50); const [,r]=chan(y); return [r+14+seed2*36, y];}
    case 'build':{const [l,r]=chan(damY); const n=Math.max(1,g.sections.length); const k=g.sections.findIndex(s=>s.progress<1); const idx=k>=0?k:i%n; return [l+(r-l)*(idx+0.5)/R.width, damY-12-seed*6];}
    case 'guard':{const y=damY+14; const [l,r]=chan(y); return i%2?[l-44-seed*30,y]:[r+44+seed*30,y];}
    case 'research':{ if(G.plate){const y=hz+8+seed*(damY-hz)*0.3; const [l]=chan(y); return [l*0.05+seed2*l*0.3,y];} const y=H*0.89+seed*H*0.05; return [W*0.10+seed2*W*0.14, y];}
    default:{ if(G.plate){const y=hz+8+seed*(damY-hz)*0.35; const [,r]=chan(y); return [r+(W-r)*(0.55+seed2*0.4),y];} const y=H*0.84+seed*H*0.1; return [W*0.72+seed2*W*0.22, y];}
  }
}
function syncActors(G){
  while(actors.length<g.roster.length){ const i=actors.length; const [hx,hy]=homeFor(i,G); actors.push({x:hx,y:hy,face:1,bob:Math.random()*6,job:'idle',tier:0,state:'home',timer:Math.random()*6,alpha:0,variant:0,tx:hx,ty:hy,mode:'idle'}); }
  while(actors.length>g.roster.length)actors.pop();
  g.roster.forEach((b,i)=>{ const a=actors[i]; a.tier=tierOf(b);
    if(a.job!==b.job){ a.job=b.job; a.variant=0; if(b.job==='idle'){ a.state='toHome'; const [hx,hy]=homeFor(i,G); a.tx=hx;a.ty=hy; } else { a.state='toWork'; [a.tx,a.ty]=targetFor(b.job,i,G,0); } } });
}
function moveActor(a,dt,speed){ const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy); if(d<2)return true; const st=Math.min(d,speed*dt); a.x+=dx/d*st; a.y+=dy/d*st; if(Math.abs(dx)>3)a.face=dx<0?-1:1; return false; }
function updateActor(a,i,dt,G){
  const walk=70+20*((a.y-G.hz)/(H-G.hz)); // px per second, nearer = faster (perspective)
  a.mode='idle';
  switch(a.state){
    case 'toWork': a.alpha=Math.min(1,a.alpha+dt*2); a.mode='walk'; if(moveActor(a,dt,walk)){ a.state='work'; a.timer=6+Math.random()*8; } break;
    case 'work': a.mode='work'; a.timer-=dt;
      if(a.timer<=0){
        if(GATHER_JOBS.has(a.job)||a.job==='build'){ a.state='toDrop'; [a.tx,a.ty]=dropPointFor(a.job,i,G); }
        else if(a.job==='guard'){ a.state='patrol'; a.variant=(a.variant+1)%4; [a.tx,a.ty]=targetFor('guard',i,G,a.variant); }
        else { a.timer=6+Math.random()*8; a.face=-a.face; }
      } break;
    case 'toDrop': a.mode='walk'; if(moveActor(a,dt,walk)){ a.state='dropping'; a.timer=0.8; } break;
    case 'dropping': a.mode='work'; a.timer-=dt; if(a.timer<=0){ a.state='toWork'; a.variant=(a.variant+1)%3; [a.tx,a.ty]=targetFor(a.job,i,G,a.variant); } break;
    case 'patrol': a.mode='walk'; if(moveActor(a,dt,walk*0.5)){ a.state='work'; a.timer=4+Math.random()*6; } break;
    case 'toHome': a.mode='walk'; if(moveActor(a,dt,walk)){ a.state='entering'; } break;
    case 'entering': a.alpha=Math.max(0,a.alpha-dt*2.5); if(a.alpha<=0){ a.state='home'; a.timer=8+Math.random()*14; } break;
    case 'home': a.alpha=0; a.timer-=dt;
      if(a.timer<=0){ if(Math.random()<0.35){ a.state='wander'; const [hx,hy]=homeFor(i,G); a.tx=hx+(Math.random()-0.5)*90; a.ty=hy+(Math.random()-0.3)*30; a.timer=0; } else a.timer=8+Math.random()*14; } break;
    case 'wander': a.alpha=Math.min(1,a.alpha+dt*2.5); a.mode='walk'; if(moveActor(a,dt,walk*0.6)){ a.state='loiter'; a.timer=2+Math.random()*3; } break;
    case 'loiter': a.timer-=dt; if(Math.random()<dt*0.4)a.face=-a.face; if(a.timer<=0){ a.state='toHome'; const [hx,hy]=homeFor(i,G); a.tx=hx;a.ty=hy; } break;
    default: a.state=a.job==='idle'?'toHome':'toWork';
  }
}

function roundLog(x,y,w,h,col,tilt){
  ctx.save(); ctx.translate(x+w/2,y+h/2); ctx.rotate(tilt||0);
  const g=ctx.createLinearGradient(0,-h/2,0,h/2); g.addColorStop(0,mix(col,'#ffffff',0.35)); g.addColorStop(0.45,col); g.addColorStop(1,mix(col,'#000000',0.45));
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,h/2); ctx.fill();
  ctx.fillStyle=mix(col,'#ffe0b0',0.5); ctx.beginPath(); ctx.ellipse(w/2-h*0.3,0,h*0.32,h*0.46,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(60,30,10,.5)'; ctx.lineWidth=0.6; ctx.beginPath(); ctx.ellipse(w/2-h*0.3,0,h*0.16,h*0.24,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawSection(i,x,secW,damY,sec,t){

    let g2=ctx.createLinearGradient(0,damY-8,0,damY+6); g2.addColorStop(0,'rgba(10,30,40,0)'); g2.addColorStop(1,'rgba(10,30,40,.55)'); ctx.fillStyle=g2; ctx.fillRect(x0-2,damY-8,w+4,14);

    g2=ctx.createLinearGradient(0,damY+4,0,damY+26); g2.addColorStop(0,'rgba(0,10,20,.45)'); g2.addColorStop(1,'rgba(0,10,20,0)'); ctx.fillStyle=g2; ctx.fillRect(x0-1,damY+4,w+2,22);

    if(Math.random()<0.006)flash=1; }
  if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+(flash*0.55)+')'; ctx.fillRect(0,0,W,H); if(flash>0.6){ ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; ctx.beginPath(); let lx=W*(0.3+Math.random()*0.4), ly=0; ctx.moveTo(lx,ly); for(let k=0;k<8;k++){ lx+=(Math.random()-0.5)*40; ly+=hz/8; ctx.lineTo(lx,ly); } ctx.stroke(); } flash-=0.08; }
  if(winter){ ctx.fillStyle='rgba(255,255,255,.85)'; for(const r of rain.slice(0,120)){ r.y=(r.y+r.v*0.003)%1; ctx.beginPath(); ctx.arc((r.x+Math.sin(t+r.v*9)*0.012)*W,r.y*H,1.2+r.v,0,Math.PI*2); ctx.fill(); } }
  if(drought){ gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,'rgba(255,190,80,.18)'); gr.addColorStop(1,'rgba(255,150,60,.05)'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H); }
  // ---- lighting: warm sun wash + vignette
  gr=ctx.createRadialGradient(W*0.78,hz*0.4,0,W*0.78,hz*0.4,W*0.9); gr.addColorStop(0,storm?'rgba(0,0,0,0)':'rgba(255,220,150,.10)'); gr.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  gr=ctx.createRadialGradient(W/2,H*0.55,H*0.35,W/2,H*0.55,H*0.95); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(5,10,15,.45)'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  if(g_paused()){ ctx.fillStyle='rgba(5,12,10,.45)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#f4e6c8'; ctx.font='36px '+getComputedStyle(document.body).getPropertyValue('--display'); ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=12; ctx.fillText('PAUSED',W/2,H/2); ctx.shadowBlur=0; }
}
function g_paused(){ return g.speed===0&&!g.complete&&g.seenHelp; }

// =====================================================================
//  LOOP
// =====================================================================
let last=performance.now(), acc=0;
let errCount=0;
function frame(now){
  requestAnimationFrame(frame); // schedule first so one bad frame never kills the loop
  const dt=Math.min(100,now-last); last=now;
  try{
    if(g.speed>0&&!g.complete&&!g.lost&&g.seenHelp){ acc+=dt*g.speed; while(acc>=DAY_MS){acc-=DAY_MS;simDay();dirty=true} }
    if(dirty){renderUI();dirty=false}
    render(now/1000);
  }catch(e){ if(errCount++<5)console.error('frame error',e); }
}
Ads.init();
if(!load())newGame();
// ?demo=N loads a mid-game showcase state on river N (for screenshots and testing); ?skipintro just skips the intro
if(typeof location!=='undefined'){ const q=new URLSearchParams(location.search);
  if(q.has('demo')){ newGame(); g.river=+q.get('demo')||2; const R=river(); g.day=60+30*g.river; g.seenHelp=true; g.res={food:120,wood:140,mud:90,stone:60,science:35}; g.lodges=3; g.stores=1;
    g.roster=[]; for(let k=0;k<20;k++)g.roster.push(newBeaver('idle')); applyJobCounts({forage:4,wood:4,mud:2,stone:2,build:4,guard:2,research:2});
    g.roster.forEach((b,i)=>{ b.xp[b.job]=i%3===0?95:i%3===1?40:5; });
    for(let i=0;i<R.width;i++){ const type=g.river>=3?'stone':g.river>=1?'mud':'stick'; if(i<R.width-2)g.sections.push({type,progress:1,hp:SECTION_TYPES[type].hp*(i%3===0?0.4:0.9),wrecked:false}); else if(i===R.width-2)g.sections.push({type,progress:0.5,hp:0,wrecked:false}); }
    g.trees=g.trees.map((v,i)=>i%4===0?0:i%4===1?0.4:1); for(const id of ['teeth','trails','mudpack'])g.research[id]=true; if(g.river>=3)g.research.stone=true; }
  if(q.has('skipintro'))g.seenHelp=true; }
resize(); requestAnimationFrame(frame);
</script>
